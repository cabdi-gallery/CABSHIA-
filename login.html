
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10051f">

    <title>Login | CABSHIA</title>

    <link rel="icon" href="assets/CABSHIA_App_Icon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
</head>

<body class="login-page">

    <div class="stars"></div>

    <a href="index.html" class="back-home">← Home</a>

    <main class="login-stage">

        <!-- Hanging Light -->
        <div class="lamp-area">
            <div class="lamp-wire"></div>
            <div class="lamp-shade"></div>
            <div class="lamp-light"></div>
        </div>

        <!-- Friendship Icons -->
        <section class="friendship-icons">

            <div class="friend-icon">
                <span>👦</span>
                <small>Cabdi</small>
            </div>

            <div class="friendship-link">∞</div>

            <div class="friend-icon">
                <span>👧</span>
                <small>Shadia</small>
            </div>

        </section>

        <!-- Login Panel -->
        <section class="login-panel">

            <div class="panel-heading">
                <img
                    src="assets/CABSHIA_App_Icon.png"
                    alt="CABSHIA"
                    class="login-logo"
                >

                <p class="small-title">YOUR PRIVATE FRIENDSHIP SPACE</p>

                <h1>Welcome <span>Back.</span></h1>

                <p class="login-description">
                    Your memories are waiting for you.
                </p>
            </div>

            <form id="loginForm">

                <label for="email">EMAIL ADDRESS</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">PASSWORD</label>

                <div class="password-box">
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                    <button
                        type="button"
                        id="togglePassword"
                        aria-label="Show password"
                    >Show</button>
                </div>

                <button type="submit" class="sign-in-button">
                    SIGN IN <span>→</span>
                </button>

                <p id="loginMessage" class="login-message"></p>

            </form>

            <p class="security-note">
                A private space for two friends.
            </p>

        </section>

        <footer class="login-footer">
            CABSHIA · TWO PEOPLE. ONE FRIENDSHIP.
        </footer>

    </main>

    <script src="login.js"></script>

</body>
</html>
