
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CABSHIA | Two People, One Friendship</title>

    <meta name="description" content="CABSHIA — Two People. One Friendship. Many Memories.">

    <meta name="theme-color" content="#10051f">

    <link rel="icon" type="image/png"
          href="assets/CABSHIA_App_Icon.png">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background -->
    <div class="stars"></div>

    <!-- Main Welcome Section -->
    <main class="welcome-container">

        <div class="welcome-content">

            <!-- CABSHIA Logo -->
            <div class="logo-container">
                <img
                    src="assets/CABSHIA_Large_Logo.png"
                    alt="CABSHIA Friendship Logo"
                    class="main-logo"
                >
            </div>

            <!-- Welcome Text -->
            <p class="welcome-label">
                WELCOME TO OUR LITTLE WORLD
            </p>

            <h1>
                Welcome to <span>CABSHIA</span>
            </h1>

            <p class="description">
                A special place for memories, friendship,
                laughter and unforgettable moments.
            </p>

            <!-- Date and Clock -->
            <div class="time-box">
                <div id="clock">00:00:00</div>
                <div id="date">Loading date...</div>
            </div>

            <!-- Enter Button -->
            <a href="login.html" class="enter-button">
                ENTER CABSHIA
                <span>→</span>
            </a>

            <p class="footer-text">
                Two People. One Friendship. Many Memories.
            </p>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
